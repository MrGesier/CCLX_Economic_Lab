function curveQuote(v,amount,side='deposit'){if(!Number.isFinite(amount)||amount<0)throw Error('Invalid curve amount.');if(side==='deposit'){const net=amount*(1-v.fee);if(v.backing+net>v.capacity+1e-8)throw Error('Project collateral capacity exceeded.');const shares=sharesForReserve(v.a,v.b,v.backing+net)-v.shares,avg=div(net,shares),spotBefore=curveSpot(v.a,v.b,v.shares),spotAfter=curveSpot(v.a,v.b,v.shares+shares);return {input:amount,shares,backingDelta:net,fee:amount-net,spotBefore,spotAfter,averagePrice:avg,averageSlippage:div(avg,spotBefore)-1,marginalMove:div(spotAfter,spotBefore)-1,totalUserCost:div(amount,shares)};}
if(side==='withdraw'){if(amount>v.shares+1e-8)throw Error('Insufficient receipt shares.');const target=Math.max(0,v.shares-amount),gross=v.backing-curveIntegral(v.a,v.b,target),avg=div(gross,amount),spotBefore=curveSpot(v.a,v.b,v.shares),spotAfter=curveSpot(v.a,v.b,target);return {input:amount,shares:amount,backingDelta:-gross,output:gross*(1-v.fee),fee:gross*v.fee,spotBefore,spotAfter,averagePrice:avg,averageSlippage:1-div(avg,spotBefore),marginalMove:div(spotAfter,spotBefore)-1,totalUserCost:div(gross*v.fee,Math.max(1e-12,gross))};}
throw Error('Unknown curve side.');}
function curveTrade(v,amount,side){const out=curveQuote(v,amount,side);if(side==='deposit'){v.shares+=out.shares;v.backing+=out.backingDelta;}else{v.shares-=out.shares;v.backing+=out.backingDelta;}v.fees+=out.fee;if(v.feeAccounts?.CCLX){v.feeAccounts.CCLX.curve_user_gross+=out.fee;v.feeAccounts.CCLX.treasury_pending+=out.fee;}if(v.backing<0||v.shares<0)throw Error('Curve insolvency.');return out;}
const positionValue=(v,shares)=>shares>0&&v.shares>0?shares/v.shares*v.backing:0;
function positionRedemptionQuote(v,shares){const q=curveQuote(v,shares,'withdraw');return {...q,proportionalValue:positionValue(v,shares),marginalValue:shares*curveSpot(v.a,v.b,v.shares)};}
function sharesForWithdrawalOutput(v,output){if(!Number.isFinite(output)||output<0)throw Error('Invalid withdrawal output.');const full=curveQuote(v,v.shares,'withdraw').output;if(output>full+1e-8)throw Error('Withdrawal exceeds current executable redemption value.');const gross=output/(1-v.fee),targetBacking=Math.max(0,v.backing-gross),targetShares=sharesForReserve(v.a,v.b,targetBacking);return v.shares-targetShares;}
function curveAudit(v){const expected=curveIntegral(v.a,v.b,v.shares);return {backing:v.backing,expected,residual:v.backing-expected,fees:v.fees,feeAccounts:v.feeAccounts,initialOwners:v.initialOwners,solvent:v.backing>=-1e-8&&Math.abs(v.backing-expected)<1e-5*Math.max(1,v.backing),spot:curveSpot(v.a,v.b,v.shares),fullyBackedRedemption:curveQuote(v,v.shares,'withdraw').output};}
/** Parameter changes require an explicit reserve transfer; a milestone alone never creates backing. */
function rebaseCurve(v,a,b,topup=0){const next=clone(v);if(a<=0||b<0||topup<0)throw Error('Invalid rebase.');const required=curveIntegral(a,b,v.shares)-v.backing;if(required>topup+1e-8)throw Error('Unfunded curve rebase.');next.a=a;next.b=b;next.backing+=required;return {vault:next,requiredTopup:Math.max(0,required),releasedReserve:Math.max(0,-required)};}

Object.assign(exports,{curveIntegral,curveSpot,sharesForReserve,newVault,curveQuote,curveTrade,positionValue,positionRedemptionQuote,sharesForWithdrawalOutput,curveAudit,rebaseCurve});
},
"curve-families":function(module,exports,require){
const {clamp,div}=require("./model");
const EPS=1e-9;
const finite=(v,name,min=-Infinity,max=Infinity)=>{
 const n=Number(v);
 if(!Number.isFinite(n)||n<min||n>max)throw Error(`${name} must be finite in [${min}, ${max}].`);
 return n;
};

function linearFromEconomics({initialPrice=1,priceAtCapacity=1.6,capacity=1}={}){
 const a=finite(initialPrice,'initialPrice',EPS),cap=finite(capacity,'capacity',EPS),p1=finite(priceAtCapacity,'priceAtCapacity',a);
 return {family:'linear',a,b:(p1-a)/cap,initialPrice:a,priceAtCapacity:p1,capacity:cap};
}

function powerFromEconomics({initialPrice=1,priceAtReference=1.6,referenceSupply=1,convexity=1.35}={}){
 const a=finite(initialPrice,'initialPrice',EPS),ref=finite(referenceSupply,'referenceSupply',EPS),n=finite(convexity,'convexity',EPS),p=finite(priceAtReference,'priceAtReference',a);
 return {family:'power',a,k:p-a,sRef:ref,n,initialPrice:a,priceAtReference:p,referenceSupply:ref,convexity:n};
}

function piecewiseFromEconomics({initialPrice=1,capacity=1,segments}={}){
 const cap=finite(capacity,'capacity',EPS);
 const points=(segments?.length?segments:[
  {supply:0,price:initialPrice},
  {supply:cap*.35,price:initialPrice*1.22},
  {supply:cap*.7,price:initialPrice*1.55},
  {supply:cap,price:initialPrice*1.9}
 ]).map((p,i)=>({supply:finite(p.supply,`segments.${i}.supply`,0),price:finite(p.price,`segments.${i}.price`,EPS)})).sort((a,b)=>a.supply-b.supply);
 if(points[0].supply!==0)points.unshift({supply:0,price:points[0].price});
 for(let i=1;i<points.length;i++){if(points[i].supply<=points[i-1].supply)throw Error('Piecewise supplies must increase.');}
 return {family:'piecewise',points,capacity:cap,initialPrice:points[0].price,priceAtCapacity:spot({family:'piecewise',points},cap)};
}

function normalizeCurve(config={}){
 const f=config.family||'linear';
 if(f==='linear')return linearFromEconomics(config);
 if(f==='power')return powerFromEconomics(config);
 if(f==='piecewise'||f==='milestone_steps')return piecewiseFromEconomics(config);
 throw Error('Unknown curve family: '+f);
}

function spot(curve,supply){
 const s=finite(supply,'supply',0);
 if(curve.family==='linear')return curve.a+curve.b*s;
 if(curve.family==='power')return curve.a+curve.k*Math.pow(s/curve.sRef,curve.n);
 if(curve.family==='piecewise'||curve.family==='milestone_steps'){
  const pts=curve.points;
  if(s<=pts[0].supply)return pts[0].price;
  for(let i=1;i<pts.length;i++){
   const lo=pts[i-1],hi=pts[i];
   if(s<=hi.supply+EPS){
    const t=div(s-lo.supply,hi.supply-lo.supply);
    return lo.price+(hi.price-lo.price)*clamp(t,0,1);
   }
  }
  const lo=pts.at(-2),hi=pts.at(-1),slope=(hi.price-lo.price)/(hi.supply-lo.supply);
  return hi.price+slope*(s-hi.supply);
 }
 throw Error('Unknown curve family: '+curve.family);
}

function integral(curve,supply){
 const s=finite(supply,'supply',0);
 if(curve.family==='linear')return curve.a*s+curve.b*s*s/2;
 if(curve.family==='power')return curve.a*s+curve.k*curve.sRef/(curve.n+1)*Math.pow(s/curve.sRef,curve.n+1);
 if(curve.family==='piecewise'||curve.family==='milestone_steps'){
  const pts=curve.points;let area=0,last=pts[0];
  if(s<=0)return 0;
  for(let i=1;i<pts.length;i++){
   const hi=pts[i],end=Math.min(s,hi.supply),dx=end-last.supply;
   if(dx>0){const pEnd=last.price+(hi.price-last.price)*dx/(hi.supply-last.supply);area+=dx*(last.price+pEnd)/2;}
   if(s<=hi.supply+EPS)return area;
   last=hi;
  }
  const prev=pts.at(-2),hi=pts.at(-1),slope=(hi.price-prev.price)/(hi.supply-prev.supply),dx=s-hi.supply;
  return area+dx*hi.price+slope*dx*dx/2;
 }
 throw Error('Unknown curve family: '+curve.family);
}

function inverseIntegral(curve,reserve,{tolerance=1e-7,maxIterations=96}={}){
 const target=finite(reserve,'reserve',0);
 if(target===0)return 0;
 if(curve.family==='linear'&&curve.b===0)return target/curve.a;
 if(curve.family==='linear')return 2*target/(Math.sqrt(curve.a*curve.a+2*curve.b*target)+curve.a);
 let hi=Math.max(1,curve.capacity||curve.sRef||1);
 while(integral(curve,hi)<target)hi*=2;
 let lo=0;
 for(let i=0;i<maxIterations;i++){
  const mid=(lo+hi)/2,v=integral(curve,mid);
  if(Math.abs(v-target)<=tolerance*Math.max(1,target))return mid;
  if(v<target)lo=mid;else hi=mid;
 }
 return (lo+hi)/2;
}

function curveSeries(curve,capacity,steps=60){
 const cap=finite(capacity,'capacity',EPS);
 return Array.from({length:steps+1},(_,i)=>{const supply=cap*i/steps;return {supply,spot:spot(curve,supply),reserve:integral(curve,supply)};});
}

function compareFamilies(base){
 const linear=normalizeCurve({...base,family:'linear'});
 const power=normalizeCurve({...base,family:'power',priceAtReference:base.priceAtCapacity,referenceSupply:base.capacity,convexity:base.convexity||1.45});
 const piecewise=normalizeCurve({...base,family:'piecewise'});
 return [linear,power,piecewise].map(curve=>({curve,series:curveSeries(curve,base.capacity)}));
}

Object.assign(exports,{linearFromEconomics,powerFromEconomics,piecewiseFromEconomics,normalizeCurve,spot,integral,inverseIntegral,curveSeries,compareFamilies});
},
"curve-fees":function(module,exports,require){
const {clone,div,sum}=require("./model");
const FEE_BUCKETS=[
 ['entry','Curve deposit fee'],
 ['exit','Curve redemption fee'],
 ['routing','Migration routing fee'],
 ['rebate','Profile or volume rebate']
];

function createFeeAccounts(){
 return {
  CCLX:{grossUserFees:0,rebates:0,netCollected:0,treasury:0,rewards:0,reserve:0,lp:0,operations:0,restrictedPending:0},
  USD:{indicativeAtCollection:0,realizedCash:0,saleFees:0,remainingValue:0},
  byProject:{},
  byProfile:{},
  bySource:{unrestricted:0,restricted:0},
  byOperation:Object.fromEntries(FEE_BUCKETS.map(([k])=>[k,0]))
 };
}

function ensureFeeProject(accounts,projectId){
 accounts.byProject[projectId]??={gross:0,net:0,entry:0,exit:0,routing:0,rebates:0,restricted:0,unrestricted:0};
 return accounts.byProject[projectId];
}

function recordFee(accounts,{projectId='network',profile='unknown',source='unrestricted',operation='entry',gross=0,rebate=0,priceUSD=0,allocations={}}){
 const g=Number(gross)||0,r=Math.min(g,Math.max(0,Number(rebate)||0)),net=g-r;
 const p=ensureFeeProject(accounts,projectId);
 accounts.CCLX.grossUserFees+=g;accounts.CCLX.rebates+=r;accounts.CCLX.netCollected+=net;
 accounts.CCLX.rewards+=net*(allocations.rewards??0);
 accounts.CCLX.reserve+=net*(allocations.reserve??0);
 accounts.CCLX.lp+=net*(allocations.lp??0);
 accounts.CCLX.operations+=net*(allocations.operations??0);
 accounts.CCLX.treasury+=Math.max(0,net*(1-sum(['rewards','reserve','lp','operations'].map(k=>allocations[k]??0))));
 accounts.USD.indicativeAtCollection+=net*priceUSD;
 accounts.USD.remainingValue+=net*priceUSD;
 accounts.byProfile[profile]=(accounts.byProfile[profile]||0)+net;
 accounts.bySource[source]=(accounts.bySource[source]||0)+net;
 accounts.byOperation[operation]=(accounts.byOperation[operation]||0)+net;
 p.gross+=g;p.net+=net;p[operation]=(p[operation]||0)+net;p.rebates+=r;p[source]=(p[source]||0)+net;
 if(source==='restricted')accounts.CCLX.restrictedPending+=net;
 return {gross:g,rebate:r,net,projectId,profile,source,operation,currency:'CCLX',beneficiary:'protocol_treasury_pending',status:source==='restricted'?'restricted_pending':'collected'};
}

function sellFeeInventory(accounts,{amountCCLX,priceUSD,executionFee=0}){
 const amount=Math.min(Math.max(0,amountCCLX),accounts.CCLX.treasury+accounts.CCLX.operations+accounts.CCLX.lp+accounts.CCLX.reserve+accounts.CCLX.rewards);
 const gross=amount*priceUSD,fee=gross*executionFee,net=gross-fee;
 accounts.USD.realizedCash+=net;accounts.USD.saleFees+=fee;accounts.USD.remainingValue=Math.max(0,accounts.USD.remainingValue-gross);
 return {amountCCLX:amount,grossUSD:gross,feeUSD:fee,netUSD:net};
}

function summarizeFeeAccounts(accounts){
 const a=clone(accounts),base=a.CCLX.grossUserFees;
 return {
  ...a,
  realizedTakeRate:div(a.CCLX.netCollected,base),
  allocationCheck:sum(['treasury','rewards','reserve','lp','operations'].map(k=>a.CCLX[k])),
  restrictedLiquidValueCCLX:a.CCLX.restrictedPending
 };
}

Object.assign(exports,{FEE_BUCKETS,createFeeAccounts,ensureFeeProject,recordFee,sellFeeInventory,summarizeFeeAccounts});
},
"curve-population":function(module,exports,require){
const {clamp,div,sum}=require("./model");
const PROFILE_MIX=[
 {id:'long_term',name:'Long-term holder',share:.38,risk:.35,activity:.55,migration:.35,ticketScale:.9,inertia:.75},
 {id:'rebalancer',name:'Rebalancer',share:.24,risk:.55,activity:1.35,migration:1.55,ticketScale:1.05,inertia:.35},
 {id:'active_user',name:'Active user',share:.25,risk:.6,activity:1.75,migration:1.1,ticketScale:.55,inertia:.25},
 {id:'whale',name:'Whale',share:.04,risk:.45,activity:.75,migration:.85,ticketScale:9,inertia:.55},
 {id:'restricted_user',name:'Restricted user',share:.09,risk:.25,activity:.45,migration:.25,ticketScale:.8,inertia:.85,restricted:true}
];

function normalizedProfiles(profiles=PROFILE_MIX){
 const total=sum(profiles.map(p=>Math.max(0,p.share)));
 return profiles.map(p=>({...p,share:div(Math.max(0,p.share),total||1)}));
}

function chooseWeighted(items,weights,r){
 const total=sum(weights.map(x=>Math.max(0,x)));
 if(total<=0)return items[0];
 let x=r()*total;
 for(let i=0;i<items.length;i++){x-=Math.max(0,weights[i]);if(x<=0)return items[i];}
 return items.at(-1);
}

function logNormalTicket(median,dispersion,r){
 const u=Math.max(1e-12,r()),v=Math.max(1e-12,r());
 const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
 return Math.max(0,median*Math.exp((dispersion||0)*z));
}

function buildParticipants(config,r){
 const profiles=normalizedProfiles(config.profiles||PROFILE_MIX),participants=[],n=Math.round(config.participants.initial);
 const raw=[];
 for(let i=0;i<n;i++){
  const p=chooseWeighted(profiles,profiles.map(x=>x.share),r);
  raw.push({profile:p,amount:logNormalTicket(config.capital.medianTicketCCLX*p.ticketScale,config.capital.dispersion,r)});
 }
 const total=sum(raw.map(x=>x.amount)),scale=div(config.totalInitialCapitalCCLX,total);
 for(let i=0;i<n;i++){
  const p=raw[i].profile,restricted=!!p.restricted&&r()<Math.max(config.restrictedShare,.65);
  participants.push({id:`u${String(i+1).padStart(5,'0')}`,profileId:p.id,profile:p.name,joinedDay:0,lastActionDay:-Infinity,active:true,restricted,wallet:{unrestricted:restricted?0:raw[i].amount*scale,restricted:restricted?raw[i].amount*scale:0},positions:{}});
 }
 return participants;
}

function addDailyParticipants(state,config,day,r){
 const countBase=config.participants.newPerDay||0,whole=Math.floor(countBase),extra=r()<countBase-whole?1:0,count=Math.max(0,whole+extra);
 if(!count)return [];
 const profiles=normalizedProfiles(config.profiles||PROFILE_MIX),created=[];
 for(let i=0;i<count&&state.participants.length<config.participants.adoptionCap;i++){
  const p=chooseWeighted(profiles,profiles.map(x=>x.share),r),amount=logNormalTicket(config.participants.budgetPerNewParticipantCCLX*p.ticketScale,config.capital.dispersion,r);
  const id=`u${String(state.participants.length+1).padStart(5,'0')}`,restricted=!!p.restricted&&r()<Math.max(config.restrictedShare,.5);
  const participant={id,profileId:p.id,profile:p.name,joinedDay:day,lastActionDay:-Infinity,active:true,restricted,wallet:{unrestricted:restricted?0:amount,restricted:restricted?amount:0},positions:{}};
  state.participants.push(participant);state.externalInflowsCCLX+=amount;created.push(participant);
 }
 return created;
}

function profileById(id,profiles=PROFILE_MIX){return (profiles||PROFILE_MIX).find(p=>p.id===id)||PROFILE_MIX[0];}

function shouldAct(participant,config,costRelative,r){
 const profile=profileById(participant.profileId,config.profiles||PROFILE_MIX);
 const monthly=config.activity.actionsPerActiveMonth*profile.activity;
 const daily=monthly/30*config.participants.activeShare;
 const elastic=config.demand.mode==='behavioral'?Math.exp(-config.activity.feeElasticity*Math.max(0,costRelative)):1;
 return r()<clamp(daily*elastic,0,.95);
}

Object.assign(exports,{PROFILE_MIX,normalizedProfiles,chooseWeighted,logNormalTicket,buildParticipants,addDailyParticipants,profileById,shouldAct});
},

function quoteWithdrawalAmount(vault,amount,{redemptionFee=0}={}){
 const net=finite(amount,'withdrawal output',0),full=quoteWithdrawal(vault,vault.shares,{redemptionFee}).output;

}

function quoteMigration(state,intent){
 const from=state.vaults[intent.originProject],to=state.vaults[intent.destinationProject];
 if(!from||!to)throw Error('Unknown migration project.');

 const routingFee=out.output*(intent.routingFee||0),depositGross=out.output-routingFee;

}

function mutateDeposit(state,p,vault,participant,amount,source,day,eventId,allowPartial=true){
 const q=quoteDeposit(vault,amount,{mintFee:p.fees.mintFee??state.config.fees.defaultMintFee,allowPartial});

}

function mutateWithdrawal(state,p,vault,participant,pos,shares,day,eventId,action='withdraw'){
 const q=quoteWithdrawal(vault,shares,{redemptionFee:p.fees.redemptionFee??state.config.fees.defaultRedemptionFee});
 if(q.averageSlippage>state.config.activity.maxSlippage)throw Error('Withdrawal slippage limit exceeded.');
 vault.backing+=q.backingDelta;vault.shares-=q.shares;pos.shares-=q.shares;pos.principalBasis*=Math.max(0,1-div(q.shares,pos.shares+q.shares));
 const source=pos.restricted?'restricted':'unrestricted';participant.wallet[pos.restricted?'restricted':'unrestricted']+=q.output;
 const fee=recordFee(state.feeAccounts,{projectId:p.id,profile:participant.profileId,source,operation:'exit',gross:q.fee,priceUSD:state.priceUSD,allocations:state.config.fees.allocations});
 state.transactions.push({eventId,day,participantId:participant.id,cohortId:participant.profileId,action,originProject:p.id,destinationProject:'wallet',requestedAmount:shares,unit:'receipts',executedAmount:q.output,sharesMinted:0,sharesBurned:q.shares,gross:q.gross,net:q.output,feesCCLX:q.fee,feeStatus:fee.status,currency:'CCLX',provenance:source,status:'executed',rejectionReason:'',slippage:q.averageSlippage,capitalNew:0,capitalRecycled:q.output});
state.counters.withdrawals+=q.gross;state.counters.actions++;chargeActionSubsidy(state);
 return q;
}

function mutateMigration(state,fromP,toP,participant,pos,shares,day,eventId){
 const from=state.vaults[fromP.id],to=state.vaults[toP.id],source=pos.restricted?'restricted':'unrestricted';
 const quote=quoteMigration(state,{originProject:fromP.id,destinationProject:toP.id,shares,redemptionFee:fromP.fees.redemptionFee,mintFee:toP.fees.mintFee,routingFee:state.config.fees.routingFee});
 if(Math.max(quote.origin.averageSlippage,quote.destination.averageSlippage)>state.config.activity.maxSlippage)throw Error('Migration slippage limit exceeded.');
 from.backing+=quote.origin.backingDelta;from.shares-=quote.origin.shares;pos.shares-=quote.origin.shares;pos.principalBasis*=Math.max(0,1-div(quote.origin.shares,pos.shares+quote.origin.shares));
 to.backing+=quote.destination.backingDelta;to.shares+=quote.destination.shares;
 const destKey=key(toP.id,pos.restricted),dest=participant.positions[destKey]??={projectId:toP.id,restricted:pos.restricted,shares:0,principalBasis:0};
 dest.shares+=quote.destination.shares;dest.principalBasis+=quote.netMoved;participant.positions[destKey]=dest;
 recordFee(state.feeAccounts,{projectId:fromP.id,profile:participant.profileId,source,operation:'exit',gross:quote.origin.fee,priceUSD:state.priceUSD,allocations:state.config.fees.allocations});
 if(quote.routingFee)recordFee(state.feeAccounts,{projectId:'network',profile:participant.profileId,source,operation:'routing',gross:quote.routingFee,priceUSD:state.priceUSD,allocations:state.config.fees.allocations});
 recordFee(state.feeAccounts,{projectId:toP.id,profile:participant.profileId,source,operation:'entry',gross:quote.destination.fee,priceUSD:state.priceUSD,allocations:state.config.fees.allocations});
 state.transactions.push({eventId,day,participantId:participant.id,cohortId:participant.profileId,action:'migration',originProject:fromP.id,destinationProject:toP.id,requestedAmount:shares,unit:'receipts',executedAmount:quote.netMoved,sharesMinted:quote.destination.shares,sharesBurned:quote.origin.shares,gross:quote.origin.gross,net:quote.destination.net,feesCCLX:quote.totalFees,currency:'CCLX',provenance:source,status:'executed',rejectionReason:'',slippage:Math.max(quote.origin.averageSlippage,quote.destination.averageSlippage),capitalNew:0,capitalRecycled:quote.netMoved,cannibalizedCapital:quote.netMoved});
state.counters.migrations+=quote.netMoved;state.counters.actions++;chargeActionSubsidy(state);

}

function reject(state,day,participant,action,reason,eventId,requestedAmount=0,unit='CCLX'){
 state.transactions.push({eventId,day,participantId:participant?.id||'',cohortId:participant?.profileId||'',action,originProject:'',destinationProject:'',requestedAmount,unit,executedAmount:0,sharesMinted:0,sharesBurned:0,gross:0,net:0,feesCCLX:0,currency:'CCLX',provenance:participant?.restricted?'restricted':'unrestricted',status:'rejected',rejectionReason:reason,capitalNew:0,capitalRecycled:0});

}

function chooseAction(participant,state,r){
 const cfg=state.config,profile=profileById(participant.profileId,cfg.profiles),probs=cfg.activity;
 const hasPosition=Object.values(participant.positions).some(p=>p.shares>EPS),hasWallet=participant.wallet.unrestricted+participant.wallet.restricted>=cfg.activity.minOrderCCLX;
 let weights=[hasWallet?probs.depositProbability:0,hasPosition?probs.withdrawProbability:0,hasPosition?probs.migrationProbability*profile.migration:0,probs.holdProbability+profile.inertia*.05];
 return chooseWeighted(['deposit','withdraw','migration','hold'],weights,r);
}

function availableProjects(state,day,operation='deposit'){
 return state.projects.filter(p=>operationsForPhase(phaseForProject(p,day))[operation]);
}

function projectWeights(state,projects,participant,day){
 return projects.map(p=>{
  const vault=state.vaults[p.id],phase=phaseForProject(p,day),newness=Math.max(0,1-(day-(p.openDay??day))/120),cost=(p.fees.mintFee||0)+(vault?Math.max(0,spot(vault.curve,vault.shares)-spot(vault.curve,0))/Math.max(1,spot(vault.curve,0))*.02:0);
  const profile=profileById(participant.profileId,state.config.profiles);
  return Math.max(.001,p.attractiveness*p.quality*(phase==='open_for_deposits'?1.1:1)*(1+state.config.demand.noveltyBoost*newness)*Math.exp(-state.config.activity.feeElasticity*cost)*(1-profile.inertia*.2));
 });
}

function positionsList(participant){return Object.values(participant.positions).filter(p=>p.shares>EPS);}

function priceForDay(config,day){
 let p=config.priceSource.cclxUsd;
 if(config.pricePath?.mode==='synthetic'&&config.pricePath.shockDay!=null&&day>=config.pricePath.shockDay)p*=1+(config.pricePath.shockPct||0);
 return Math.max(EPS,p);
}

function protocolRetainedFeesCCLX(accounts){
 return sum(['treasury','reserve','lp','operations'].map(k=>accounts.CCLX[k]||0));
}

function chargeActionSubsidy(state){
 const subsidy=state.config.fees.subsidyPerActionCCLX||0;
 if(subsidy>0)state.costsUSD+=subsidy*state.priceUSD;
}

function projectDailyCostUSD(config,p){
 return (config.costs?.projectDailyUSD||0)>0?config.costs.projectDailyUSD:(p.costs?.dailyUSD||0);
}

function reconcileCurveState(state){
 const wallet=sum(state.participants.map(p=>p.wallet.unrestricted+p.wallet.restricted));
 const reserves=sum(Object.values(state.vaults).map(v=>v.backing));
 const fees=state.feeAccounts.CCLX.netCollected;
 const total=wallet+reserves+fees;
 const expected=state.initialCCLX+state.externalInflowsCCLX-state.externalOutflowsCCLX;
 const receiptsResidual=sum(Object.values(state.vaults).map(v=>{
  const owned=sum(state.participants.flatMap(p=>positionsList(p).filter(x=>x.projectId===v.projectId).map(x=>x.shares)))+sum(Object.values(v.initialOwners));
  return Math.abs(owned-v.shares);
 }));
 return {wallet,reserves,fees,total,expected,residual:total-expected,receiptsResidual,solvent:Object.values(state.vaults).every(v=>v.backing>=-EPS&&v.shares>=-EPS),ok:Math.abs(total-expected)<=1e-5*Math.max(1,expected)&&receiptsResidual<=1e-5*Math.max(1,sum(Object.values(state.vaults).map(v=>v.shares)))};
}

function dailyMetrics(state,day){
 const phaseCounts={announced:0,open_for_deposits:0,funded:0,operating:0,matured:0,closed:0,defaulted:0};
 for(const p of state.projects){const ph=phaseForProject(p,day);if(phaseCounts[ph]!=null)phaseCounts[ph]++;}
 const active=state.participants.filter(p=>p.active).length,withPositions=state.participants.filter(p=>positionsList(p).length).length;
 const reserves=sum(Object.values(state.vaults).map(v=>v.backing)),fees=state.feeAccounts.CCLX.netCollected,reconcile=reconcileCurveState(state);
 const dayTx=state.transactions.filter(t=>t.day===day),slips=dayTx.map(t=>t.slippage).filter(Number.isFinite),rejected=dayTx.filter(t=>t.status==='rejected').length;
 const retained=protocolRetainedFeesCCLX(state.feeAccounts),retainedValue=retained*state.priceUSD;
 return {day,priceUSD:state.priceUSD,participants:state.participants.length,activeParticipants:active,depositors:withPositions,phaseCounts,reservesCCLX:reserves,walletsCCLX:reconcile.wallet,feesCCLX:fees,feesIndicativeUSD:state.feeAccounts.USD.indicativeAtCollection,protocolRetainedFeesCCLX:retained,protocolRetainedValueUSD:retainedValue,modeledCostsUSD:state.costsUSD,netProtocolResultUSD:retainedValue-state.costsUSD,externalInflowsCCLX:state.externalInflowsCCLX,capitalNewCCLX:state.counters.capitalNew,capitalRecycledCCLX:state.counters.migrations,depositVolumeCCLX:state.counters.deposits,withdrawalVolumeCCLX:state.counters.withdrawals,migrationVolumeCCLX:state.counters.migrations,actions:state.counters.actions,rejected,partial:state.counters.partial,p50Slippage:quantile(slips,.5),p95Slippage:quantile(slips,.95),accountingResidualCCLX:reconcile.residual,receiptResidual:reconcile.receiptsResidual};
}

function runCurveSimulation(input=defaultCurveLabConfig(),{seed=input.seed,onProgress,signal,scenario={}}={}){
 const config=mergeCurveLabConfig(input,scenario),errors=validateCurveConfig(config);if(errors.length)throw Error(errors.join('; '));
 const r=rng(seed),projects=materializeCurveProjects(config),vaults=Object.fromEntries(projects.map(p=>[p.id,makeVault(p)])),participants=buildParticipants(config,r);
 const initialReserves=sum(Object.values(vaults).map(v=>v.backing));
 const state={config,projects,vaults,participants,feeAccounts:createFeeAccounts(),transactions:[],daily:[],priceUSD:config.priceSource.cclxUsd,initialCCLX:sum(participants.map(p=>p.wallet.unrestricted+p.wallet.restricted))+initialReserves,externalInflowsCCLX:0,externalOutflowsCCLX:0,costsUSD:0,counters:{actions:0,rejected:0,partial:0,deposits:0,withdrawals:0,migrations:0,capitalNew:0},eventSeq:0,warnings:[config.projectFinancing?.reason,'Baseline mode is collateral vault: receipts are reserve claims, not project-financing rights.'].filter(Boolean)};
 const dayOrder=()=>[...participants.keys()].sort(()=>r()-.5);
 for(let day=0;day<=config.horizonDays;day++){
  if(signal?.aborted)throw Error('cancelled');
  state.priceUSD=priceForDay(config,day);
  const added=addDailyParticipants(state,config,day,r);if(added.length)state.transactions.push({eventId:`e${++state.eventSeq}`,day,participantId:'network',cohortId:'new_entrants',action:'external_capital_inflow',originProject:'external',destinationProject:'wallets',requestedAmount:sum(added.map(p=>p.wallet.unrestricted+p.wallet.restricted)),unit:'CCLX',executedAmount:sum(added.map(p=>p.wallet.unrestricted+p.wallet.restricted)),gross:0,net:0,feesCCLX:0,currency:'CCLX',provenance:'external',status:'executed',rejectionReason:'',capitalNew:sum(added.map(p=>p.wallet.unrestricted+p.wallet.restricted)),capitalRecycled:0});
  state.costsUSD+=config.costs.networkDailyUSD+sum(projects.filter(p=>phaseForProject(p,day)!=='not_created'&&phaseForProject(p,day)!=='closed').map(p=>projectDailyCostUSD(config,p)));
  const activeProjects=availableProjects(state,day,'deposit');
  for(const idx of dayOrder()){
   const p=participants[idx];if(!p.active)continue;
   const costRelative=config.fees.defaultMintFee+config.fees.defaultRedemptionFee;
   if(!shouldAct(p,config,costRelative,r))continue;
   const eventId=`e${++state.eventSeq}`,action=chooseAction(p,state,r);
   try{
    if(action==='hold')continue;
    if(action==='deposit'){
     if(!activeProjects.length)throw Error('No project open for deposits.');
     const source=p.wallet.unrestricted>=p.wallet.restricted?'unrestricted':'restricted',wallet=p.wallet[source],amount=Math.min(wallet*config.activity.movableFraction*(.5+r()),config.capital.individualCapCCLX);
     if(amount<config.activity.minOrderCCLX)throw Error('Insufficient available wallet balance.');
     const prj=chooseWeighted(activeProjects,projectWeights(state,activeProjects,p,day),r);
     mutateDeposit(state,prj,state.vaults[prj.id],p,amount,source,day,eventId,true);
    }else if(action==='withdraw'){
     const pos=chooseWeighted(positionsList(p),positionsList(p).map(x=>x.shares),r),prj=projects.find(x=>x.id===pos.projectId);
     if(!operationsForPhase(phaseForProject(prj,day)).withdraw)throw Error('Origin project is not open for withdrawal.');
     const shares=pos.shares*config.activity.movableFraction*(.35+r()*.9);
     mutateWithdrawal(state,prj,state.vaults[prj.id],p,pos,shares,day,eventId);
    }else if(action==='migration'){
     const pos=chooseWeighted(positionsList(p),positionsList(p).map(x=>x.shares),r),fromP=projects.find(x=>x.id===pos.projectId),dests=availableProjects(state,day,'migrateIn').filter(x=>x.id!==fromP.id);
     if(!operationsForPhase(phaseForProject(fromP,day)).migrateOut||!dests.length)throw Error('No valid migration route.');
     const toP=chooseWeighted(dests,projectWeights(state,dests,p,day),r),shares=pos.shares*config.activity.movableFraction*(.35+r()*.9);
     mutateMigration(state,fromP,toP,p,pos,shares,day,eventId);
    }
   }catch(err){reject(state,day,p,action,err.message,eventId);}
  }
  if(config.activity.whaleExitDay!=null&&day===config.activity.whaleExitDay){
   for(const p of participants.filter(x=>x.profileId==='whale'))for(const pos of positionsList(p)){try{const prj=projects.find(x=>x.id===pos.projectId);mutateWithdrawal(state,prj,state.vaults[prj.id],p,pos,pos.shares*config.activity.whaleExitShare,day,`e${++state.eventSeq}`,'whale_exit');}catch(err){reject(state,day,p,'whale_exit',err.message,`e${++state.eventSeq}`);}}
  }
  const rec=reconcileCurveState(state);if(!rec.ok)throw Error(`Curve accounting residual ${rec.residual} / receipts ${rec.receiptsResidual}`);
  state.daily.push(dailyMetrics(state,day));
  if(onProgress&&(day%7===0||day===config.horizonDays))onProgress(day/config.horizonDays);
 }
 const result={schemaVersion:'curve-result/1.0',seed,config,projects:projects.map(p=>({id:p.id,name:p.name,origin:p.origin,phases:{createdDay:p.createdDay,openDay:p.openDay,fundraisingEndDay:p.fundraisingEndDay,operatingDay:p.operatingDay,maturityDay:p.maturityDay},floorBuffer:p.floorBuffer,fees:p.fees,curve:p.curve})),daily:state.daily,transactions:state.transactions,feeAccounts:summarizeFeeAccounts(state.feeAccounts),warnings:state.warnings,reconciliation:reconcileCurveState(state)};
 result.summary=summarizeCurveRun(result);
 return result;
}

function summarizeCurveRun(result){
 const d=result.daily,last=d.at(-1)||{},avgReserve=div(sum(d.map(x=>x.reservesCCLX)),d.length),tx=result.transactions,executed=tx.filter(t=>t.status==='executed'),rejected=tx.filter(t=>t.status==='rejected');
 const slips=executed.map(t=>t.slippage).filter(Number.isFinite),activeAvg=div(sum(d.map(x=>x.activeParticipants)),d.length),months=Math.max(1,(last.day||0)/30);
 const fees=result.feeAccounts.CCLX.netCollected,projectFees=Object.entries(result.feeAccounts.byProject).map(([id,v])=>({id,net:v.net}));
 const topProject=Math.max(0,...projectFees.map(x=>x.net)),feeConcentration=div(topProject,fees);
 return {
  cumulativeFeesCCLX:fees,protocolRetainedFeesCCLX:last.protocolRetainedFeesCCLX||0,protocolRetainedValueUSD:last.protocolRetainedValueUSD||0,modeledCostsUSD:last.modeledCostsUSD||0,indicativeFeesUSD:result.feeAccounts.USD.indicativeAtCollection,netProtocolResultUSD:last.netProtocolResultUSD||0,
  averageDailyFeesCCLX:div(fees,d.length),averageMonthlyFeesCCLX:div(fees,months),takeRate:result.feeAccounts.realizedTakeRate,
  feesPerActiveParticipantCCLX:div(fees,activeAvg),reserveAverageCCLX:avgReserve,reserveFinalCCLX:last.reservesCCLX||0,
  actionFrequencyMonthly:div(executed.length,activeAvg*months),vaultTurnover:div((last.depositVolumeCCLX||0)+(last.withdrawalVolumeCCLX||0)+2*(last.migrationVolumeCCLX||0),avgReserve),
  migrationRate:div(last.migrationVolumeCCLX||0,avgReserve),rejectedDemandRate:div(rejected.length,tx.length),partialOrderRate:div(tx.filter(t=>t.status==='partial').length,tx.length),
  p50Slippage:quantile(slips,.5),p95WithdrawalSlippage:quantile(executed.filter(t=>t.action==='withdraw'||t.action==='migration'||t.action==='whale_exit').map(t=>t.slippage).filter(Number.isFinite),.95),
  p95RoundTripCost:quantile(executed.map(t=>div(t.feesCCLX,Math.max(1,t.executedAmount+t.feesCCLX))).filter(Number.isFinite),.95),
  participantsFinal:last.participants||0,activeParticipantsAverage:activeAvg,retention90d:div(result.daily.find(x=>x.day===90)?.depositors||last.depositors||0,result.config.participants.initial),
  capitalNewCCLX:last.capitalNewCCLX||0,capitalRecycledCCLX:last.capitalRecycledCCLX||0,feeConcentrationTopProject:feeConcentration,
  accountingResidualCCLX:result.reconciliation.residual,receiptResidual:result.reconciliation.receiptsResidual,valid:result.reconciliation.ok
 };
}

"curve-optimizer":function(module,exports,require){
const {clone,div,quantile,sum}=require("./model");
const {rng}=require("./stress");
const {mergeCurveLabConfig}=require("./curve-sim-config");
const {runCurveSimulation}=require("./curve-simulation");
function setPath(obj,path,value){
 const keys=path.split('.');let o=obj;
 for(const k of keys.slice(0,-1)){o[k]??={};o=o[k];}
 o[keys.at(-1)]=value;
}

function sampleSpec(spec,r){
 if(spec.values)return spec.values[Math.floor(r()*spec.values.length)];
 const min=spec.min??0,max=spec.max??1,v=min+(max-min)*r();
 return spec.type==='integer'?Math.round(v):v;
}

const DEFAULT_SEARCH_SPACE={
 initialProjects:{type:'integer',values:[2,3,5]},
 targetProjects:{type:'integer',values:[3,5,10]},
 launchIntervalDays:{type:'integer',min:30,max:365},
 minDemandBeforeLaunchCCLX:{type:'number',min:0,max:1000000},
 mintFee:{type:'number',min:0,max:.03},
 redemptionFee:{type:'number',min:0,max:.05},
 slopeScale:{type:'number',min:.5,max:2},
 cooldownDays:{type:'integer',values:[0,7,30,90]}
};

const DEFAULT_CONSTRAINTS=[
 'p95WithdrawalSlippage <= 0.05',
 'rejectedDemandRate <= 0.10',
 'medianProjectUtilization >= 0.20',
 'accountingResidualCCLX == 0'
];

function candidateConfig(base,params){
 const cfg=clone(base),initial=Math.min(params.initialProjects,params.targetProjects),target=params.targetProjects,interval=params.launchIntervalDays;
 cfg.projectSchedule=[{day:0,targetActiveProjects:initial},{day:interval,targetActiveProjects:Math.max(initial,Math.ceil((initial+target)/2))},{day:interval*2,targetActiveProjects:target}];
 cfg.activity.cooldownDays=params.cooldownDays;
 cfg.fees.defaultMintFee=params.mintFee;cfg.fees.defaultRedemptionFee=params.redemptionFee;
 cfg.searchPolicy={minDemandBeforeLaunchCCLX:params.minDemandBeforeLaunchCCLX};
 for(const p of cfg.projects){
  p.fees.mintFee=params.mintFee;p.fees.redemptionFee=params.redemptionFee;
  if(p.curve.family==='linear'&&Number.isFinite(p.curve.b))p.curve.b*=params.slopeScale;
  if(p.curve.family==='power')p.curve.convexity=Math.max(.25,(p.curve.convexity||1.35)*params.slopeScale);
 }
 return cfg;
}

function evaluateConstraints(summary){
 const violations=[];
 if(summary.p95WithdrawalSlippage>.05)violations.push('p95WithdrawalSlippage > 0.05');
 if(summary.rejectedDemandRate>.10)violations.push('rejectedDemandRate > 0.10');
 if(Math.abs(summary.accountingResidualCCLX)>1e-5)violations.push('accountingResidualCCLX != 0');
 if(summary.reserveAverageCCLX<=0)violations.push('reserveAverageCCLX <= 0');
 return violations;
}

function aggregateSeedRuns(runs){
 const summaries=runs.map(r=>r.summary),pick=k=>summaries.map(s=>s[k]).filter(Number.isFinite);
 return {
  grossFeesCCLX:quantile(pick('cumulativeFeesCCLX'),.5),
  netProtocolResult:quantile(pick('netProtocolResultUSD'),.5),
  netProtocolResultP05:quantile(pick('netProtocolResultUSD'),.05),
  retention90d:quantile(pick('retention90d'),.5),
  p95RoundTripCost:quantile(pick('p95RoundTripCost'),.95),
  p95WithdrawalSlippage:quantile(pick('p95WithdrawalSlippage'),.95),
  rejectedDemandRate:quantile(pick('rejectedDemandRate'),.95),
  accountingResidualCCLX:Math.max(...pick('accountingResidualCCLX').map(Math.abs),0),
  reserveAverageCCLX:quantile(pick('reserveAverageCCLX'),.5),
  validationSpread:pick('netProtocolResultUSD').length?quantile(pick('netProtocolResultUSD'),.95)-quantile(pick('netProtocolResultUSD'),.05):0
 };
}

function dominates(a,b){
 return a.feasible&&(!b.feasible||(
  a.netProtocolResult>=b.netProtocolResult&&
  a.retention90d>=b.retention90d&&
  a.p95RoundTripCost<=b.p95RoundTripCost&&
  (a.netProtocolResult>b.netProtocolResult||a.retention90d>b.retention90d||a.p95RoundTripCost<b.p95RoundTripCost)
 ));
}

function optimizeCurveConfig(base,{searchSpace=DEFAULT_SEARCH_SPACE,constraints=DEFAULT_CONSTRAINTS,selectionSeeds=[101,102,103],validationSeeds=[901],budget=80,onProgress}={}){
 const random=rng(base.seed^0xA51CE),candidates=[];
 for(let i=0;i<budget;i++){
  const params=Object.fromEntries(Object.entries(searchSpace).map(([k,s])=>[k,sampleSpec(s,random)]));
  const cfg=candidateConfig(base,params),runs=[];
  let error='';
  try{for(const seed of selectionSeeds)runs.push(runCurveSimulation(cfg,{seed}));}catch(err){error=err.message;}
  const agg=error?{grossFeesCCLX:0,netProtocolResult:-Infinity,retention90d:0,p95RoundTripCost:Infinity,p95WithdrawalSlippage:Infinity,rejectedDemandRate:Infinity,accountingResidualCCLX:Infinity,reserveAverageCCLX:0,validationSpread:Infinity}:aggregateSeedRuns(runs);
  const violations=error?[error]:evaluateConstraints(agg);
  candidates.push({candidateId:`cand_${String(i+1).padStart(3,'0')}`,...params,...agg,seeds:selectionSeeds.join('|'),validationSeeds:validationSeeds.join('|'),constraints,violations,feasible:violations.length===0,paretoRank:null});
  if(onProgress&&(i%5===0||i===budget-1))onProgress((i+1)/budget);
 }
 for(const c of candidates)c.paretoRank=candidates.some(o=>o!==c&&dominates(o,c))?2:1;
 const feasible=candidates.filter(c=>c.feasible).sort((a,b)=>b.netProtocolResult-a.netProtocolResult||b.retention90d-a.retention90d||a.p95RoundTripCost-b.p95RoundTripCost);
 for(const c of feasible.slice(0,Math.min(5,feasible.length))){
  const cfg=candidateConfig(base,c),runs=[];
  try{for(const seed of validationSeeds)runs.push(runCurveSimulation(cfg,{seed}));const v=aggregateSeedRuns(runs);c.validationNetProtocolResult=v.netProtocolResult;c.validationSpread=v.validationSpread;c.validationRejectedDemandRate=v.rejectedDemandRate;}
  catch(err){c.violations.push('validation: '+err.message);c.feasible=false;}
 }
 return {schemaVersion:'curve-optimizer/1.0',budget,selectionSeeds,validationSeeds,searchSpace,constraints,candidates,pareto:candidates.filter(c=>c.paretoRank===1&&c.feasible),best:feasible[0]||null,summary:{tested:candidates.length,feasible:candidates.filter(c=>c.feasible).length,pareto:candidates.filter(c=>c.paretoRank===1&&c.feasible).length,medianNetProtocolResult:quantile(candidates.filter(c=>Number.isFinite(c.netProtocolResult)).map(c=>c.netProtocolResult),.5)}};
}

function exportCandidatesCSV(result){
 const keys=['candidateId','initialProjects','targetProjects','launchIntervalDays','minDemandBeforeLaunchCCLX','mintFee','redemptionFee','slopeScale','cooldownDays','seeds','validationSeeds','grossFeesCCLX','netProtocolResult','validationNetProtocolResult','capitalExternal','retention90d','reserveAverageCCLX','p95RoundTripCost','p95WithdrawalSlippage','rejectedDemandRate','accountingResidualCCLX','feasible','paretoRank','violations','validationSpread'];
 return [keys,...result.candidates.map(c=>keys.map(k=>k==='violations'?c.violations.join('; '):k==='capitalExternal'?'' : c[k]??''))];
}

Object.assign(exports,{DEFAULT_SEARCH_SPACE,DEFAULT_CONSTRAINTS,optimizeCurveConfig,exportCandidatesCSV});
},

function liquidityFrontier(c,scales=[.25,.5,.75,1,1.5,2,3,4]){return scales.map(scale=>{const x=clone(c);for(const k of ['budget','cexQuote','dexQuote','cexTokens','dexTokens'])x.liquidity[k]*=scale;x.liquidity.cexDepth=x.liquidity.cexDepth.map(v=>v*scale);const m=makeMarket(x),sell=executeSell(m,c.liquidity.tradeTarget),buy=executeBuy(m,c.liquidity.tradeTarget*c.launchPrice);return {scale,budget:x.liquidity.budget,tokenInventory:x.liquidity.cexTokens+x.liquidity.dexTokens,depth2:marketDepth(m,200).total,sellSlippage:sell.slippage,buySlippage:buy.slippage,inventoryOK:x.liquidity.cexTokens+x.liquidity.dexTokens<=x.allocations.find(a=>a.id==='liquidity').tokens};});}
function priceDepthGrid(c,prices=[.5,.75,1,1.25,1.5,2],sizes=[25000,100000,250000,500000,1000000,3000000]){return prices.map(multiplier=>{const m=makeMarket(c,c.launchPrice*multiplier);return {multiplier,price:m.mid,depth2:marketDepth(m,200).total,trades:sizes.map(tokens=>{const q=executeSell(m,tokens);return {tokens,notional:tokens*m.mid,proceeds:q.quote,slippage:q.slippage};})};});}
function unlockPressureAudit(c,months=60,price=c.launchPrice){const schedule=unlockSchedule(c,months),depth=marketDepth(makeMarket(c,price),200).total;return schedule.slice(1).map(row=>{const pressure=row.scheduledSellTokens*price,required=pressure*c.liquidity.coverageTarget;return {month:row.month,unlocked:row.liquidDelta,restricted:row.restrictedDelta,rewardCeiling:row.rewardCeiling,expectedSell:row.scheduledSellTokens,pressure,depth,coverage:pressure>0?depth/pressure:null,requiredDepth:required,gap:Math.max(0,required-depth),byBucket:row.deltas};});}

function launchReadiness(c,stress=null,attacks=null){const audit=initialLiquidityAudit(c),checks=[...audit.checks.map(x=>({category:'Liquidity',...x})),{category:'Tokenomics',name:'Supply / allocations / emissions reconcile',pass:validate(c).length===0,detail:validate(c).join('; ')||'All working supply constraints reconcile.'},{category:'Tokenomics',name:'Bridge has no free-sale release',pass:unlockSchedule(c,60).every(x=>x.scheduledSellTokens<=x.liquidDelta+1e-6),detail:'Restricted and unissued balances excluded from sale pressure.'},{category:'Risk',name:'Live market depth independently verified',pass:false,detail:'No authenticated live market snapshot or executable MM mandate provided.',status:'unverified'},{category:'Risk',name:'Smart contracts independently audited',pass:false,detail:'No deployed contracts or independent security audit provided.',status:'unverified'},{category:'Legal',name:'Instrument, reward and redemption rights approved',pass:false,detail:'Legal, regulatory and contractual analysis is outside the model.',status:'unverified'},{category:'Treasury',name:'Project cash flow and reserve evidence verified',pass:false,detail:'All current project revenue, expenses, reserves and default inputs are placeholders.',status:'unverified'}];if(stress){checks.push({category:'Stress',name:'Depth coverage meets target in 95% of paths',pass:stress.summary.depthBreachProbability<=.05,detail:`Breach probability ${(100*stress.summary.depthBreachProbability).toFixed(1)}%.`},{category:'Stress',name:'Dedicated liquidity reserve survives stress',pass:stress.summary.reserveExhaustionProbability<=.05,detail:`Exhaustion probability ${(100*stress.summary.reserveExhaustionProbability).toFixed(1)}%.`});}if(attacks)checks.push({category:'Security',name:'Model exploit checks pass',pass:attacks.failed===0,detail:`${attacks.passed} passed, ${attacks.failed} failed, ${attacks.unverified} not verified.`});return {checks,passed:checks.filter(x=>x.pass).length,failed:checks.filter(x=>!x.pass&&x.status!=='unverified').length,unverified:checks.filter(x=>x.status==='unverified').length,ready:checks.every(x=>x.pass),message:'A model-only pass cannot establish investment, legal, contract-security or production launch readiness.'};}

"calibration":function(module,exports,require){
const {sum,stats}=require("./model");
const {executeSell,executeBuy,marketDepth,depthLadder}=require("./market");
/** External order-book evidence is not protocol-owned liquidity. No live data is fetched. */
function parseOrderBookCSV(text){const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)throw Error('CSV must contain a header and at least one order.');const header=lines.shift().split(',').map(x=>x.trim().toLowerCase());const index=k=>header.indexOf(k);for(const k of ['side','price','quantity'])if(index(k)<0)throw Error('Missing CSV column: '+k);const rows=lines.map((line,i)=>{const cols=line.split(',').map(x=>x.trim());const side=cols[index('side')].toLowerCase(),price=Number(cols[index('price')]),quantity=Number(cols[index('quantity')]);if(!['bid','ask','buy','sell'].includes(side)||!Number.isFinite(price)||price<=0||!Number.isFinite(quantity)||quantity<=0)throw Error('Invalid order on line '+(i+2));return {side:side==='buy'?'bid':side==='sell'?'ask':side,price,quantity,venue:index('venue')>=0?cols[index('venue')]:'Imported'};});return rows;}
function analyzeSnapshot(rows,c,mid=null){if(!rows.length)throw Error('Empty order book.');const bids=rows.filter(r=>r.side==='bid').sort((a,b)=>b.price-a.price),asks=rows.filter(r=>r.side==='ask').sort((a,b)=>a.price-b.price);const reference=mid||((bids[0]?.price||c.launchPrice)+(asks[0]?.price||c.launchPrice))/2;if(!Number.isFinite(reference)||reference<=0)throw Error('Invalid reference price.');const m={mid:reference,bids:bids.map(r=>({bps:Math.max(0,(1-r.price/reference)*1e4),cash:r.price*r.quantity})),asks:asks.map(r=>({bps:Math.max(0,(r.price/reference-1)*1e4),tokens:r.quantity})),x:0,y:0,cexFee:c.liquidity.cexFee,dexFee:c.liquidity.dexFee,externalArbCash:0,externalArbTokens:0};const depths=depthLadder(m),trade=executeSell(m,c.liquidity.tradeTarget),buy=executeBuy(m,c.liquidity.tradeTarget*reference);return {mid:reference,levels:rows.length,venues:[...new Set(rows.map(r=>r.venue))],bidQuote:sum(bids.map(r=>r.price*r.quantity)),askTokens:sum(asks.map(r=>r.quantity)),spread:bids.length&&asks.length?(asks[0].price-bids[0].price)/reference:0,depths,trade,buy,bids,asks,warning:'User-supplied snapshot only. No freshness, ownership, spoofing, latency or venue connectivity verification. Identical cross-venue quotes may not be independently executable. No DEX liquidity is assumed.'};}

Object.assign(exports,{parseOrderBookCSV,analyzeSnapshot});
},

 const optimizer=()=>`${tabs}<div class="grid g2">${card('Search setup',table(['Parameter','Range'],Object.entries(DEFAULT_SEARCH_SPACE).map(([k,v])=>[k,v.values?v.values.join(', '):`${v.min} → ${v.max}`]))+`<div class="page-actions">${btn('Run bounded search','run-curve-optimizer','primary')}${btn('Export candidates CSV','export-curve-candidates')}</div><p class="source-note">The search compares candidates under fixed assumptions and reports “best among candidates tested”, never a guaranteed real optimum.</p>`)}${card('Constraints',checksView(DEFAULT_CONSTRAINTS.map(c=>({name:c,detail:'Editable demonstration constraint from the spec.',pass:!opt||true}))))}</div>${opt?`<div class="section-label">Candidate results</div><div class="grid g4">${metric('Tested',F(opt.summary.tested),'candidate configs')}${metric('Feasible',F(opt.summary.feasible),'after accounting/slippage/refusal checks')}${metric('Pareto',F(opt.summary.pareto),'non-dominated feasible')}${metric('Best net result',opt.best?U(opt.best.netProtocolResult,2):'None','under selection seeds')}</div>${card('Optimization candidates',table(['ID','Mint fee','Exit fee','Slope','Projects','Net result','Retention','P95 cost','Rejected','Feasible','Pareto','Violations'],opt.candidates.slice(0,30).map(c=>[c.candidateId,P(c.mintFee,2),P(c.redemptionFee,2),F(c.slopeScale,2),`${c.initialProjects}→${c.targetProjects}`,Number.isFinite(c.netProtocolResult)?U(c.netProtocolResult,0):'Invalid',P(c.retention90d,1),P(c.p95RoundTripCost,2),P(c.rejectedDemandRate,1),badge(c.feasible?'Yes':'No',c.feasible?'green':'red'),c.paretoRank,c.violations.join('; ')])))}`:'<div class="empty"><h3>No optimizer run yet.</h3><p>Run the bounded search to compare fee, slope, cooldown and network-growth candidates.</p></div>'}`;

`<div class="section-label">Executable depth / marginal-price bands</div><div class="grid g2">${card('Bid and ask depth ladder',table(['Distance','Bid cash','DEX quote','Total bids','Ask notional'],a.bands.map(r=>['±'+r.bps+' bps',U(r.cex),U(r.dex),U(r.total),U(marketDepth(m,r.bps,'buy').total)])),'Fees are reported in execution quotes; depth is not the average slippage of a trade.')}${card('Reference execution simulator',`<div class="form-grid">${select('Side','quote-side',[['sell','Sell CCLX'],['buy','Buy CCLX']],state.quoteSide)}<div class="field"><label>Order size (CCLX)</label><input id="quote-amount" type="number" min="0" step="1000" value="${state.quoteAmount}"></div></div><div class="quote-box">${kv(state.quoteSide==='sell'?[['Input',M(state.quoteAmount)+' CCLX'],['Net proceeds',U(q.quote,2)],['Average price',U(q.average,5)],['Slippage',P(q.slippage,3)],['Unfilled',M(q.unfilled)+' CCLX']]:[['Quote offered',U(state.quoteAmount*config.launchPrice)],['Tokens acquired',M(q.tokens)],['Average price',U(q.average,5)],['Slippage',P(q.slippage,3)],['Unspent cash',U(q.unfilled)]])}</div><div class="chart-title">Maximum executable size at a given slippage</div>${table(['Slippage limit','Sell tokens','Sell notional','Buy cash'],a.capacity.map(r=>[P(r.slippage),M(r.sell.input),U(r.sell.notional),U(r.buy.input)]))}<p class="source-note">These figures assume the initial book has not been consumed by earlier orders. The stress engine maintains finite reserves across months.</p>`)}</div>`+
`<div class="section-label">Liquidity sizing frontier</div>${card('Capital versus executable depth',chart([{name:'2% bid depth',values:frontier.map(x=>x.depth2),color:colours.green},{name:'Quote capital',values:frontier.map(x=>x.budget),color:colours.blue}],{labels:frontier.map(x=>x.scale+'×'),format:U})+table(['Scale','Quote budget','Token inventory','Depth ±2%','Sell slippage','Inventory within allocation'],frontier.map(x=>[x.scale+'×',U(x.budget),M(x.tokenInventory),U(x.depth2),P(x.sellSlippage,2),badge(x.inventoryOK?'Yes':'No',x.inventoryOK?'green':'red')])),'Scaling a synthetic book is a capital-sizing exercise, not evidence of a real market-making commitment.')}`+

function funding(){

 const raised=sum(f.map(x=>x.raised)),tokens=sum(f.map(x=>x.tokens));

 const fundingCard=card('Round pricing and valuation',table(['Round','Price','FDV','Tokens','Supply','Proceeds','Cliff','Linear','TGE'],fundingRows),'FDV = round price × maximum supply. This is a token-sale funding table, not the equity cap table of CCL. Prices and terms are working proposals, not confirmed transactions.');

 const bridgeBody=kv([['Internal capacity',M(config.bridge.internalCap)+' CCLX'],['Reference valuation ceiling',U(config.bridge.valuationCap)],['Eligible legacy supply',M(config.bridge.eligibleSupply)+' CO2BIT'],['Illustrative ratio',F(b.ratio,2)+':1'],['Restricted release',config.bridge.cliff+'m cliff + '+config.bridge.linear+'m linear'],['Free market-sale entitlement','0 CCLX']])+'<p class="source-note">No new supply outside the 200M ceiling. The reference valuation is not evidence of CO2BIT market value. Actual entitlement, identity, burn/lock and claim rules require formal validation.</p>';
 const vestRows=bs.filter(x=>x.kind==='liquid'||x.kind==='restricted').map(b=>{

   return [esc(b.name),M(b.tokens),editable('cliff',b.cliff),editable('linear',b.linear),editable('tge',b.tge,100),editable('sellRate',b.sellRate,100)];
 });
 const vestCard=card('Round and internal vesting table',table(['Bucket','Tokens','Cliff m','Linear m','TGE %','Sale rate %'],vestRows)+'<p class="source-note">Cliff + linear duration is measured from TGE. Non-sale buckets use governed or programmatic schedules. Their circulating status does not automatically imply unrestricted market sales.</p>','Editable sale rounds. All other parameters are available in Assumptions.');
 const cumulativeChart=chart([{name:'Ordinary vested',values:schedule.map(r=>r.liquid),color:colours.green},{name:'Restricted eligible',values:schedule.map(r=>r.restricted),color:colours.purple},{name:'Reward ceiling',values:schedule.map(r=>r.rewardCeiling),color:colours.blue}],{labels:schedule.map(r=>'M'+r.month),format:M});

function stress(){const r=state.stress,s=config.stress;return title('Financial Simulation','A monthly, seeded financial simulation with finite trading liquidity, correlated project revenue, defaults, vesting and capped rewards. Run the growth baseline or combine shocks.','02 / ECONOMIC LAB',btn('Run simulation','run-stress','primary')+btn('Run all scenarios','run-all'))+
notice('P05 / P50 / P95 are percentiles of synthetic simulated paths, not forecast confidence intervals. The external reference price is a stochastic assumption, not a model-derived fair value. Endogenous flow impact and arbitrage are simplified; no live market calibration is implied.','blue')+
`<div class="grid g2">${card('Scenario & simulation controls',`<div class="form-grid">${select('Scenario preset','stress-scenario',SCENARIOS.map(x=>[x.id,x.name]),state.scenario)}<div class="field"><label>Random seed</label><input data-config="stress.seed" type="number" step="1" value="${s.seed}"></div>${input('Paths','stress.paths',s.paths,1,'Recommended 100–300; all-scenario runs use at most 100 paths each',1)}${input('Horizon (months)','stress.months',s.months,1,'Up to 120 months',1)}${input('Annual drift','stress.annualDrift',s.annualDrift,.01,'0.28 = +28%; lognormal price process',-5)}${input('Annual volatility','stress.annualVol',s.annualVol,.05,'0.32 = 32% volatility')}${input('Jump probability / month','stress.jumpProbability',s.jumpProbability,.01)}${input('Jump mean log return','stress.jumpMean',s.jumpMean,.05,'Negative jumps allowed',-5)}${input('Shock month','stress.shockMonth',s.shockMonth,1)}${input('One-off shock','stress.shockSize',s.shockSize,.05,'-0.40 = -40%',-1)}</div><div class="page-actions">${btn('Run selected scenario','run-stress','primary')}${btn('Reset stress inputs','reset-stress')}</div>`,'Every parameter can also be edited in the JSON configuration.')}${card('Economic and liquidity controls',`<div class="form-grid">${input('Unlock selling rate','stress.unlockSellRate',s.unlockSellRate,.05)}${input('Reward selling rate','stress.rewardSellRate',s.rewardSellRate,.05)}${input('Organic monthly selling','stress.organicSellRate',s.organicSellRate,.001)}${input('Organic monthly buying','stress.organicBuyRate',s.organicBuyRate,.001)}${input('MM shock withdrawal','stress.mmShock',s.mmShock,.05)}${input('Monthly MM replenishment','stress.mmReplenishment',s.mmReplenishment,.05)}${input('Dedicated liquidity reserve USD','stress.liquidityReserve',s.liquidityReserve,50000)}${input('Explicit monthly external topup','stress.liquidityTopup',s.liquidityTopup,10000)}${input('Finite arbitrage cash USD','stress.externalArbCash',s.externalArbCash,50000)}${input('Finite arbitrage tokens','stress.externalArbTokens',s.externalArbTokens,100000)}${input('Project default multiplier','stress.projectDefaultMultiplier',s.projectDefaultMultiplier,.25)}${input('Revenue growth','stress.revenueGrowth',s.revenueGrowth,.05,'Annualized',-5)}${input('Staking participation','stress.stakingParticipation',s.stakingParticipation,.05)}${input('Maximum execution slippage','stress.maxExecutionSlippage',s.maxExecutionSlippage,.05)}</div><p class="source-note">The liquidity reserve is not project collateral or a general risk reserve. External arbitrage accounts are finite and are not protocol cash. Market makers cannot replenish bids beyond cash actually allocated.</p>`)}</div>`+
`<div class="section-label">${r?'Latest simulation results':'Run a scenario to calculate the risk distribution'}</div>`+(r?stressResults(r):`<div class="grid g3">${SCENARIOS.filter(x=>x.id!=='base').map(x=>`<div class="scenario-card"><div class="scenario-title">${esc(x.name)}</div><div class="scenario-text">${esc(x.description)}</div>${btn('Select scenario','scenario:'+x.id,'small')}</div>`).join('')}</div>`);}
function stressResults(r){if(r.scenarios)return `<div class="grid g3">${r.scenarios.map(x=>card(esc(x.name),kv([['Median terminal price',U(x.summary.terminalPrice.p50,4)],['P05 terminal price',U(x.summary.terminalPrice.p05,4)],['Depth breach probability',P(x.summary.depthBreachProbability)],['Reserve shortfall probability',P(x.summary.reserveExhaustionProbability)],['Median max drawdown',P(x.summary.maxDrawdown.p50)]])+`<div class="page-actions">${btn('Select and rerun','scenario:'+x.id,'small')}</div>`)).join('')}</div>`;
const z=r.series,sm=r.summary;return `<div class="grid g4">${metric('Terminal price / median',U(sm.terminalPrice.p50,4),'P05 '+U(sm.terminalPrice.p05,4)+' · P95 '+U(sm.terminalPrice.p95,4))}${metric('Depth breach probability',P(sm.depthBreachProbability),'Any month below '+F(config.liquidity.coverageTarget,2)+'× coverage',sm.depthBreachProbability>.05?'bad':'good')}${metric('Liquidity reserve shortfall',P(sm.reserveExhaustionProbability),'Refill demand exceeds available reserve',sm.reserveExhaustionProbability>.05?'bad':'good')}${metric('Median maximum drawdown',P(sm.maxDrawdown.p50),'Across '+r.meta.paths+' paths')}</div>`+
`<div class="grid g2" style="margin-top:18px">${card('Price distribution',bandChart(z,'price',x=>U(x,3))+'<p class="chart-caption">Monthly reference price after simplified flow feedback. The individual executable book may have a different marginal price.</p>','P05 / median / P95','span2')}${card('Market depth and expected selling',chart([{name:'2% bid depth / median',values:z.map(x=>x.depth.p50),color:colours.blue},{name:'Total selling pressure / median',values:z.map(x=>x.totalPressureUSD.p50),color:colours.amber},{name:'Unlock selling / median',values:z.map(x=>x.unlockSalesUSD.p50),color:colours.red}],{labels:z.map(x=>'M'+x.month),format:U})+'<p class="chart-caption">Depth is measured before each month’s simulated flows. Total pressure includes queued selling, so repeated months may contain unexecuted orders from earlier periods.</p>','', 'span2')}${card('Coverage and queue',bandChart(z,'coverage',x=>F(x,2)+'×')+chart([{name:'Median unfilled queue (CCLX)',values:z.map(x=>x.queue.p50),color:colours.red}],{labels:z.map(x=>'M'+x.month),height:150,format:M})+'<p class="chart-caption">Coverage is capped at 10× for display; no-selling months are excluded from breach counts. Queued tokens are not counted as new unlocks in the next month.</p>','', 'span2')}</div>`+
`<div class="section-label">Unlock pain zones <span class="subtle">Probability of insufficient depth across paths</span></div>${card('Monthly stress heatmap',table(['Month','Median price','Median 2% depth','Unlock sales USD','Total pressure USD','Coverage P05 / P50','Breach probability','Unlock-only breach','Queued-sale probability','Zone'],z.map(x=>['M'+x.month,U(x.price.p50,4),U(x.depth.p50),U(x.unlockSalesUSD.p50),U(x.totalPressureUSD.p50),F(x.coverage.p05,2)+'× / '+F(x.coverage.p50,2)+'×',P(x.failProbability),P(x.unlockFailProbability),P(x.queueProbability),`<span class="heat-cell ${x.failProbability>=.5?'critical':x.failProbability>=.2?'watch':'normal'}">${x.zone}</span>`])),'Red = at least 50% of paths breach the coverage threshold; amber = at least 20%. Unlock-only breach isolates the new scheduled sell flow. The all-in measure includes rewards, organic flow and queued orders.')}`+
`<div class="grid g2" style="margin-top:18px">${card('Capital, emissions and project risk',kv([['Median minimum liquidity reserve',U(sm.liquidityReserve.p50)],['Median liquidity support consumed',U(sm.liquidityConsumed.p50)],['Median minimum risk reserve',U(sm.riskReserve.p50)],['Median realized cash yield',U(sm.realYield.p50)],['Median bootstrap emissions',M(sm.rewards.p50)+' CCLX'],['Median restricted rewards',M(sm.restrictedRewards.p50)+' CCLX'],['Median project defaults',F(sm.defaults.p50,1)],['Median uncovered project losses',U(sm.uncoveredLoss.p50)],['95% tail return / VaR',P(r.distribution.var95)],['Expected shortfall 95%',P(r.distribution.expectedShortfall95)]])+'<p class="source-note">VaR and expected shortfall are return-based scenario statistics. They can be negative under positive-return distributions and are not investment-loss guarantees.</p>')}${card('Simulation reproducibility',kv([['Paths',F(r.meta.paths)],['Horizon',r.meta.months+' months'],['Seed',r.meta.seed],['Engine','GBM + jumps + finite execution'],['Cohort release model','Cliff + linear vesting'],['Reward budget','Fixed annual emission ceilings'],['Restricted principal','Excluded from market sales'],['Data provenance','Synthetic / user-editable']])+`<div class="page-actions">${btn('Export full results JSON','export-stress','primary')}${btn('Export monthly CSV','export-stress-csv')}${btn('Export path summaries CSV','export-paths')}</div><p class="source-note">Sensitivity and scenario results should be recalibrated with independently verified market and cash-flow data before use in an investment decision.</p>`)}</div>`;}

`<div class="section-label">Economic attack experiments</div><div class="grid g3">${card('Manipulation / sandwich proxy',kv([['Attacker spend',U(e.sandwich.attackerSpend)],['Victim spend',U(e.sandwich.victimSpend)],['Victim execution loss',M(e.sandwich.victimLossTokens)+' CCLX'],['Attacker round-trip P&L',U(e.sandwich.attackerPnL,2)]])+`<p class="source-note">${esc(e.sandwich.warning)}</p>`)}${card('Oracle / collateral distortion',kv([['Reference price',U(e.oracle.reference,4)],['Manipulated price',U(e.oracle.manipulated,4)],['Unsafe borrow capacity',U(e.oracle.unsafeBorrow)],['Guarded borrow capacity',U(e.oracle.guardedBorrow)]])+`<p class="source-note">Borrowing against restricted collateral is prohibited. Ordinary lending remains disabled by default, pending independent oracle controls.</p>`)}${card('Flash-staking capture',kv([['Illustrative epoch budget',M(e.flashStake.epochBudget)+' CCLX'],['Transient stake',M(e.flashStake.transientStake)],['Unsafe same-block capture',M(e.flashStake.unsafeCapture)],['Time-weighted guarded capture',M(e.flashStake.guardedCapture)]])+`<p class="source-note">${esc(e.flashStake.reason)} Production enforcement is unverified.</p>`)}</div>`+
`<div class="section-label">Required production security gates</div>${card('Unverified integration and operational controls',checksView([{category:'Identity',name:'Sybil / beneficial-owner aggregation',detail:'External KYC/UBO, sanctions and entitlement proofs are not connected.',status:'unverified'},{category:'Contracts',name:'Restricted transfer hooks and receipt wrappers',detail:'No Solidity implementation, EVM invariant fuzzing, reentrancy or independent audit.',status:'unverified'},{category:'Oracle',name:'Staleness, deviation and manipulation resistance',detail:'No signed external prices or on-chain TWAP implementation.',status:'unverified'},{category:'Execution',name:'MEV, flash loans and atomic claims',detail:'Time-weighted rewards and nonce checks are modeled, not deployed.',status:'unverified'},{category:'Operations',name:'MM mandates, reserve custody and emergency controls',detail:'No external evidence, custody reconciliation or incident response testing.',status:'unverified'}]))}`;}

(a?`<div class="section-label">Imported snapshot analysis</div><div class="grid g4">${metric('Reference mid',U(a.mid,5),'From supplied best bid/ask')}${metric('Quoted spread',P(a.spread,3),'Snapshot only')}${metric('Bid quote',U(a.bidQuote),'Not committed protocol cash')}${metric('Quoted ask tokens',M(a.askTokens),'Snapshot only')}</div><div class="grid g2" style="margin-top:18px">${card('Imported executable depth',table(['Band','Bid quote','Ask quote'],a.depths.map(x=>['±'+x.bps+' bps',U(x.total),U(marketDepth({mid:a.mid,bids:a.bids,asks:a.asks,x:0,y:0,cexFee:config.liquidity.cexFee,dexFee:config.liquidity.dexFee},x.bps,'buy').total)])))}${card('Reference order execution',kv([['Sell input',M(config.liquidity.tradeTarget)+' CCLX'],['Sell proceeds',U(a.trade.quote)],['Sell slippage',P(a.trade.slippage,2)],['Unfilled sell',M(a.trade.unfilled)+' CCLX'],['Buy tokens received',M(a.buy.tokens)],['Buy slippage',P(a.buy.slippage,2)]])+`<p class="source-note">${esc(a.warning)}</p>`)}</div>`:'')+
`<div class="section-label">Model data requirements</div>${card('What to collect before calibration',table(['Dataset','Minimum useful fields','Purpose'],[['CEX L2 order books','Timestamp, venue, bid/ask prices and quantities, cancellation rate','Depth, spread, resilience and withdrawal distributions'],['DEX pools','Reserves, fee tier, liquidity distribution, swaps, gas','Executable on-chain depth and price impact'],['Trade tape','Signed trades, volume, timestamps, block / venue','Order-flow intensity and price impact'],['MM arrangements','Funded cash, token inventory, quoted spread/depth, replenishment limits','Determine genuinely committed liquidity'],['Token holders','Vesting wallets, beneficial owners, circulation and locked balances','Unlock sell propensity and concentration'],['Project cash flows','Realized receipts, costs, reserves, defaults, contractual waterfall','Calibrate real yield and credit risk'],['Token price history','Returns, realized volatility, jumps, correlations','Fit stochastic scenarios and validate holdout performance']]))}`;}

function assumptions(){const errors=validate(config),a=launchReadiness(config,state.stress&&!state.stress.scenarios?state.stress:null,state.attacks),b=config.bridge;return title('Assumptions, governance & launch gates','Edit the complete model, inspect its source hierarchy and assess what remains unverified. All material token allocations must be transparent, including the internal legacy conversion capacity.','03 / CONTROLS',btn('Export config JSON','export-config','primary')+btn('Import config JSON','import-config'))+
`<div class="grid g4">${metric('Configuration errors',F(errors.length),errors.length?'Resolve before simulation':'Supply and parameter rules reconcile',errors.length?'bad':'good')}${metric('Model checks passed',F(a.passed),'Not a production approval')}${metric('Failed model checks',F(a.failed),'Includes stress gates when available',a.failed?'bad':'')}${metric('Unverified gates',F(a.unverified),'External evidence required')}</div>`+
(errors.length?notice(errors.map(esc).join('<br>'),'red'):notice('The configuration passes the model’s structural validation. This does not validate the commercial terms, legal rights, real cash flows or launch liquidity.','blue'))+
`<div class="section-label">Launch-readiness gate register</div>${card('Evidence required before production',checksView(a.checks))} `+
`<div class="grid g2" style="margin-top:18px">${card('Bridge and reward assumptions',`<div class="form-grid">${input('Legacy internal cap CCLX','bridge.internalCap',b.internalCap,100000)}${input('Legacy reference value USD','bridge.valuationCap',b.valuationCap,100000)}${input('Eligible legacy supply','bridge.eligibleSupply',b.eligibleSupply,100000)}${input('Registered legacy supply','bridge.registered',b.registered,100000)}${input('Conversion reference price','bridge.referencePrice',b.referencePrice,.005)}${input('Bridge cliff months','bridge.cliff',b.cliff,1)}${input('Bridge linear months','bridge.linear',b.linear,1)}${input('Claim window days','bridge.claimWindow',b.claimWindow,30)}${input('Assumed take-up','bridge.assumedTakeup',b.assumedTakeup,.05)}${input('Per-beneficial-owner cap','bridge.perEntityCap',b.perEntityCap,.01)}${input('Bootstrap APR target','stress.bootstrapTargetAPR',config.stress.bootstrapTargetAPR,.01)}${input('Cash yield share','stress.feeToRewards',config.stress.feeToRewards,.05)}</div><p class="source-note">The internal capacity is a proposal within Team & Founders. Restricted principal and restricted rewards cannot be sold or used as borrowing collateral. Published investor materials must disclose material economic allocations and restrictions.</p>`)}${card('Cash-flow waterfall and model policy',`<div class="form-grid">${input('Risk reserve share','stress.feeToRisk',config.stress.feeToRisk,.05)}${input('Liquidity reserve share','stress.feeToLiquidity',config.stress.feeToLiquidity,.05)}${input('Operations share','stress.feeToOps',config.stress.feeToOps,.05)}${input('Cash buffer USD','stress.cashBuffer',config.stress.cashBuffer,50000)}${input('Risk reserve USD','stress.reserveRisk',config.stress.reserveRisk,50000)}${input('Collateral haircut','stress.collateralHaircut',config.stress.collateralHaircut,.05)}</div><div class="divider"></div>${kv([['Total waterfall allocation',P(sum(['feeToRewards','feeToRisk','feeToLiquidity','feeToOps'].map(k=>config.stress[k])))],['Maximum token supply',M(config.supply)],['Sale allocation',M(allocation(config,'sales'))],['Reward allocation',M(allocation(config,'rewards'))],['Restricted borrowing','Prohibited'],['Unfunded curve rebase','Prohibited']])}<p class="source-note">Cash distributions are based on realized distributable income only. Project losses, reserves and contractual seniority must be implemented and independently reconciled before production.</p>`)}</div>`+
`<div class="section-label">Complete editable configuration</div>${card('JSON editor — advanced parameters',`<p class="card-sub">Every project parameter, token allocation, funding round, liquidity ladder and stress setting can be edited here. Apply validates the complete configuration before replacing it. Changes reset the mock and invalidate previous simulation results.</p><textarea id="config-json" class="code" rows="18" spellcheck="false">${esc(state.rawJSON||JSON.stringify(config,null,2))}</textarea><div class="page-actions">${btn('Validate & apply JSON','apply-json','primary')}${btn('Reset to working defaults','reset-config')}${btn('Download JSON','export-config')}</div>`)} `+
`<div class="section-label">Source hierarchy and open decisions</div>${card('Model provenance',table(['Source','What is used'],[['CCLX Token Condensed v4/v5','Working 200M maximum supply, five financing rounds, 26M rewards and 18% Team & Founders allocation.'],['2 September 2026 workshop','CO2BIT conversion restricted to project collateral; Green Bond terminology Reporting and Transparency; rewards included in proposed CCLX model.'],['Integrated architecture V8','Separate financing contracts, treasury/project accounting, MRV and project-specific pools.'],['Economic Lab','All market prices, liquidity amounts, revenues, default probabilities, APR assumptions and trading behavior are synthetic.']])+`<p class="source-note">Unresolved decisions: exact legal token rights, verified legacy entitlement and valuation, definitive vesting terms, project cash-flow waterfall, receipt architecture, real yield denomination, market-maker commitments, oracle design and security audit. The prototype chooses conservative restrictions where terms remain unsettled; it must not be presented as an approved token contract.</p>`)} `;}

const pages={overview,mock,'curve-lab':curveLab,liquidity,funding,stress,exploits,calibration,assumptions};
function render(){try{$('#root').innerHTML=shell();}catch(e){console.error(e);$('#root').innerHTML=`<div class="boot"><h2>Render error</h2><p>${esc(e.message)}</p><button onclick="location.reload()">Reload</button></div>`;}}
function invalidate(){state.mock=newMock(config);state.stress=null;state.attacks=null;state.imported=null;state.rawJSON='';save();}
function runWorker(all=false){if(state.running)return;const e=validate(config);if(e.length){toast(e.join('; '),true);return;}state.running=true;state.runKind='stress';state.progress=0;render();const worker=makeWorker();state.worker=worker;const id=Date.now();worker.onmessage=ev=>{if(ev.data.id!==id)return;if(ev.data.type==='progress'){state.progress=ev.data.progress;const overlay=$('.progress-overlay');if(overlay){const fill=overlay.querySelector('.progress-fill');if(fill)fill.style.width=P(state.progress,0);const h=overlay.querySelector('.card-head span');if(h)h.textContent=F(state.progress*100)+'%';}}else{state.running=false;state.runKind='';worker.terminate();state.worker=null;if(ev.data.type==='done'){state.stress=ev.data.result;state.stress.assumptions=clone(config);state.page='stress';render();toast('Simulation completed. Results are synthetic and reproducible.');}else{render();toast(ev.data.error,true);}}};worker.onerror=e=>{state.running=false;state.runKind='';worker.terminate();state.worker=null;render();toast(e.message||'Simulation worker failed',true);};worker.postMessage({id,config:clone(config),scenario:SCENARIOS.find(x=>x.id===state.scenario)?.changes||{},all});}
function runCurveWorker(kind='curve-sim'){if(state.running)return;const e=validateCurveConfig(state.curveConfig);if(e.length){toast(e.join('; '),true);return;}state.running=true;state.runKind=kind;state.progress=0;render();const worker=makeWorker();state.worker=worker;const id=Date.now(),scenario=CURVE_LAB_SCENARIOS.find(x=>x.id===state.curveScenario)?.changes||{};worker.onmessage=ev=>{if(ev.data.id!==id)return;if(ev.data.type==='progress'){state.progress=ev.data.progress;const fill=$('.progress-fill');if(fill)fill.style.width=P(state.progress,0);}else{state.running=false;state.runKind='';worker.terminate();state.worker=null;if(ev.data.type==='done'){if(kind==='curve-optimize')state.curveOptimizer=ev.data.result;else state.curveResult=ev.data.result;state.page='curve-lab';state.curveTab=kind==='curve-optimize'?'optimizer':'simulation';render();toast(kind==='curve-optimize'?'Optimization completed.':'Bonding curve simulation completed.');}else{render();toast(ev.data.error||'Curve worker failed',true);}}};worker.onerror=e=>{state.running=false;state.runKind='';worker.terminate();state.worker=null;render();toast(e.message||'Curve worker failed',true);};worker.postMessage({id,kind,config:clone(state.curveConfig),scenario,options:kind==='curve-optimize'?{searchSpace:DEFAULT_SEARCH_SPACE,constraints:DEFAULT_CONSTRAINTS,selectionSeeds:[101,102,103],validationSeeds:[901,902],budget:60}:{seed:state.curveConfig.seed}});}
function doMock(type,args={}){try{state.mock=mockAction(state.mock,config,type,args);render();toast('Mock transaction completed.');}catch(e){toast(e.message,true);}}
function changeConfig(el){try{const path=el.dataset.config;let value=Number(el.value);if(el.dataset.scale)value/=Number(el.dataset.scale);if(!Number.isFinite(value))throw Error('Enter a finite number.');set(path,value);render();toast('Assumption updated. The mock and prior results were reset to keep the model consistent.');}catch(e){render();toast(e.message,true);}}
function applyJSON(text){const next=JSON.parse(text);const errors=validate(next);if(errors.length)throw Error(errors.join('; '));config=next;invalidate();render();toast('Configuration applied. Previous simulation results were invalidated.');}
function handleAction(action){if(action.startsWith('go-'))return navigate(action.slice(3));if(action.startsWith('scenario:')){state.scenario=action.split(':')[1];navigate('stress');return;}
if(action.startsWith('choose-project:')){state.projectId=action.split(':')[1];state.page='mock';render();setTimeout(()=>document.querySelector('.section-label:nth-of-type(3)')?.scrollIntoView({block:'center',behavior:'smooth'}),50);return;}
switch(action){case 'menu':state.sidebar=!state.sidebar;render();return;case 'refresh':render();return;case 'reset-mock':doMock('reset');return;case 'advance-30':doMock('advance',{amount:30});return;case 'advance-365':doMock('advance',{amount:365});return;case 'mock-trade':doMock(state.mockSide,{amount:state.mockAmount,nonce:'demo-'+crypto.randomUUID()});return;
case 'mock-allocate':{const source=$('#allocation-source')?.value||'liquid',amount=Number($('#pool-amount')?.value);state.mockAmount=amount;doMock('allocate',{amount,projectId:state.projectId,restricted:source!=='liquid',source:source==='restrictedRewards'?'reward':source});return;}
